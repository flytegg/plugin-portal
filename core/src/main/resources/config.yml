DownloadPlatforms:
  # Platforms listed here will be ignored for plugin downloads.
  # Example:
  # Disabled:
  #   - SPIGOTMC
  #   - HANGAR
  Disabled: []

Telemetry:
  # Sends minimal Plugin Portal startup telemetry to help track compatibility and update health.
  # Includes Plugin Portal version, server software/version, and managed plugin count.
  Enabled: true

DiscordWebhook:
  # Optional Discord webhook URL for install, update, platform-switch, and PluginPortal update notifications.
  Url: ""

RemoteControl:
  # Enable explicitly with /pp control enable (or /ppv control enable) in this console.
  # Approval covers plugin changes from both the account dashboard and network controllers.
  AllowWrites: false
